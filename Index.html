<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تی‌اِیت شاپ — نسخه نهایی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#0d0d0f;--card:#16161a;--hover:#1e1e24;--text:#e8e8ea;--muted:#9a9aa0;
  --accent:#e63946;--accent2:#ff4757;--gold:#f4a261;--green:#10b981;
  --blue:#3b82f6;--purple:#8b5cf6;--border:#26262d;--radius:12px;
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Vazirmatn",Tahoma,sans-serif;background:var(--bg);color:var(--text);
  line-height:1.8;direction:rtl;overflow-x:hidden}
a{color:inherit;text-decoration:none;transition:.2s}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
.container{max-width:1280px;margin:0 auto;padding:0 20px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius);
  font-weight:600;font-size:14px;transition:.25s;cursor:pointer;border:none;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-2px);box-shadow:0 8px 20px rgba(230,57,70,.4)}
.btn-outline{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:var(--card);color:var(--text)}
.btn-ghost:hover{background:var(--hover)}
.btn-danger{background:#7f1d1d;color:#fff}
.btn-danger:hover{background:#991b1b}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#059669}
.btn-info{background:var(--blue);color:#fff}
.btn-info:hover{background:#2563eb}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:#7c3aed}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-xs{padding:4px 10px;font-size:11px}
.btn-icon{padding:8px;width:34px;height:34px;justify-content:center}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}

.input,.textarea,.select{width:100%;background:var(--bg);color:var(--text);
  border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;transition:.2s}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(230,57,70,.15)}
.textarea{resize:vertical;min-height:100px}
.form-group{margin-bottom:18px}
.form-group label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
.form-hint{font-size:12px;color:var(--muted);margin-top:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}

.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;
  font-weight:600;background:var(--card);color:var(--muted)}
.badge-green{background:rgba(16,185,129,.15);color:#34d399}
.badge-red{background:rgba(230,57,70,.15);color:#f87171}
.badge-gold{background:rgba(244,162,97,.15);color:var(--gold)}
.badge-blue{background:rgba(59,130,246,.15);color:#60a5fa}
.badge-purple{background:rgba(139,92,246,.15);color:#a78bfa}

.top-bar{background:#000;color:var(--muted);font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}
.top-bar .container{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top-bar i{color:var(--accent);margin-left:5px}
.top-bar .sep{margin:0 12px;opacity:.3}
.top-bar-social a{margin-right:12px;font-size:15px}

.site-header{background:rgba(22,22,26,.95);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:20px}
.logo{font-size:24px;font-weight:900;display:flex;align-items:center;gap:10px}
.logo i{color:var(--accent);font-size:30px}
.logo span{color:var(--accent)}
.main-nav ul{display:flex;gap:26px;list-style:none}
.main-nav a{font-weight:500;font-size:15px;position:relative;padding-bottom:4px}
.main-nav a:hover,.main-nav a.active{color:var(--accent)}
.main-nav a.active::after{content:"";position:absolute;bottom:-6px;right:0;left:0;height:2px;
  background:var(--accent);border-radius:2px}
.header-actions{display:flex;gap:14px;align-items:center}
.header-actions .icon-btn{position:relative;font-size:20px;color:var(--text)}
.header-actions .icon-btn:hover{color:var(--accent)}
.badge-count{position:absolute;top:-6px;left:-8px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.mobile-toggle{display:none;font-size:24px}
@media(max-width:900px){.main-nav{display:none}.mobile-toggle{display:block}}

.hero{padding:70px 0 90px;background:radial-gradient(ellipse at 80% 20%,rgba(230,57,70,.15),transparent 60%),
  radial-gradient(ellipse at 20% 80%,rgba(244,162,97,.08),transparent 60%),linear-gradient(180deg,#0d0d0f,#16161a)}
.hero-inner{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.hero h1{font-size:50px;font-weight:900;line-height:1.3;margin-bottom:18px}
.hero h1 span{color:var(--accent);display:block}
.hero p{color:var(--muted);font-size:16px;margin-bottom:28px;max-width:520px}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}
.hero-visual{position:relative;height:400px}
.floating-card{position:absolute;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);animation:float 4s ease-in-out infinite}
.floating-card:nth-child(1){top:20px;right:20px;width:220px}
.floating-card:nth-child(2){bottom:40px;left:0;width:250px;animation-delay:1.5s}
.floating-card:nth-child(3){top:50%;right:40%;width:170px;animation-delay:3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.fc-product{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.fc-product:last-child{margin-bottom:0}
.fc-img{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.fc-img img{width:100%;height:100%;object-fit:cover}
.fc-title{font-size:13px;font-weight:600}
.fc-price{font-size:12px;color:var(--gold);font-weight:700}
.fc-stars{color:var(--gold);font-size:12px}
@media(max-width:900px){.hero-inner{grid-template-columns:1fr}.hero h1{font-size:34px}
  .hero-visual{height:320px}.floating-card:nth-child(3){display:none}}

.section{padding:70px 0}
.section-head{text-align:center;margin-bottom:45px}
.section-head h2{font-size:32px;font-weight:800;margin-bottom:10px}
.section-head h2 span{color:var(--accent)}
.section-head p{color:var(--muted);font-size:15px}

.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.category-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:32px 20px;text-align:center;transition:.3s;cursor:pointer}
.category-card:hover{transform:translateY(-6px);border-color:var(--accent);background:var(--hover)}
.category-icon{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:28px;margin:0 auto 14px;color:#fff}
.category-card h3{font-size:15px;font-weight:700;margin-bottom:4px}
.category-card span{font-size:13px;color:var(--muted)}
@media(max-width:900px){.category-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.category-grid{grid-template-columns:1fr}}

.products-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:.3s;position:relative}
.product-card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:var(--shadow)}
.product-badge{position:absolute;top:14px;right:14px;background:var(--accent);color:#fff;
  font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;z-index:2}
.product-badge.sale{background:var(--gold);color:#000}
.product-img{height:210px;background:linear-gradient(135deg,#1e1e24,#2a2a35);
  display:flex;align-items:center;justify-content:center;font-size:76px;color:var(--muted);
  transition:.4s;overflow:hidden;cursor:pointer}
.product-img img{width:100%;height:100%;object-fit:cover;transition:.4s}
.product-card:hover .product-img{color:var(--accent)}
.product-card:hover .product-img img{transform:scale(1.08)}
.product-info{padding:16px}
.product-info h3{font-size:15px;font-weight:700;margin-bottom:8px;line-height:1.5;cursor:pointer}
.product-stars{color:var(--gold);font-size:12px;margin-bottom:10px}
.product-price{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-size:16px;font-weight:800;color:var(--accent)}
.price del{font-size:12px;color:var(--muted);font-weight:400;margin-right:6px}
.add-to-cart{width:36px;height:36px;border-radius:50%;background:var(--bg);
  border:1px solid var(--border);color:var(--text);display:flex;align-items:center;
  justify-content:center;font-size:16px;transition:.3s}
.add-to-cart:hover{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:900px){.products-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.products-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.products-grid{grid-template-columns:1fr}}

.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.blog-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:.3s;cursor:pointer}
.blog-card:hover{transform:translateY(-6px);border-color:var(--accent)}
.blog-thumb{height:180px;background:linear-gradient(135deg,#2a2a35,#1e1e24);
  display:flex;align-items:center;justify-content:center;font-size:60px;color:var(--accent)}
.blog-body{padding:20px}
.blog-meta{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap}
.blog-meta i{color:var(--accent)}
.blog-body h3{font-size:16px;font-weight:700;margin-bottom:10px;line-height:1.6}
.blog-body p{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.8}
.read-more{color:var(--accent);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
@media(max-width:900px){.blog-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.blog-grid{grid-template-columns:1fr}}

.newsletter{padding:60px 0;background:linear-gradient(135deg,var(--accent),#8b0000);text-align:center}
.newsletter h2{font-size:28px;font-weight:800;margin-bottom:10px;color:#fff}
.newsletter p{color:rgba(255,255,255,.9);margin-bottom:24px}
.newsletter-form{max-width:500px;margin:0 auto;display:flex;gap:8px;background:#fff;
  padding:8px;border-radius:60px}
.newsletter-form input{flex:1;border:none;outline:none;padding:12px 20px;
  background:transparent;font-size:14px;color:#000}
.newsletter-form button{border:none;background:#000;color:#fff;padding:12px 26px;
  border-radius:60px;font-weight:700;font-size:14px}
@media(max-width:520px){.newsletter-form{flex-direction:column;border-radius:12px}
  .newsletter-form button{border-radius:8px}}

.site-footer{background:#000;border-top:1px solid var(--border);padding:60px 0 0}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;gap:40px;
  padding-bottom:50px;border-bottom:1px solid var(--border)}
.footer-col h3{font-size:16px;font-weight:800;margin-bottom:20px;position:relative;padding-bottom:10px}
.footer-col h3::after{content:"";position:absolute;bottom:0;right:0;width:36px;
  height:3px;background:var(--accent);border-radius:3px}
.footer-col p,.footer-col a{color:var(--muted);font-size:13px;display:block;margin-bottom:10px}
.footer-col a:hover{color:var(--accent)}
.footer-col .contact-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;
  color:var(--muted);font-size:13px}
.footer-col .contact-item i{color:var(--accent);font-size:16px;margin-top:4px}
.footer-social{display:flex;gap:10px;margin-top:16px}
.footer-social a{width:38px;height:38px;border-radius:50%;background:var(--card);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  color:var(--text);font-size:17px;margin:0}
.footer-social a:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.footer-bottom{padding:20px 0;text-align:center;font-size:12px;color:var(--muted)}
.footer-bottom a{color:var(--accent)}
@media(max-width:900px){.footer-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.footer-grid{grid-template-columns:1fr}}

.back-to-top{position:fixed;bottom:26px;left:26px;width:48px;height:48px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:20px;display:flex;align-items:center;
  justify-content:center;opacity:0;visibility:hidden;transition:.3s;z-index:90;
  box-shadow:0 6px 20px rgba(230,57,70,.4)}
.back-to-top.show{opacity:1;visibility:visible}
.back-to-top:hover{transform:translateY(-4px)}

.toast{position:fixed;bottom:26px;right:26px;background:var(--card);
  border:1px solid var(--border);border-right:4px solid var(--accent);
  padding:14px 20px;border-radius:10px;box-shadow:var(--shadow);
  z-index:200;transform:translateX(-400px);transition:.3s;max-width:340px}
.toast.show{transform:translateX(0)}
.toast-success{border-right-color:var(--green)}
.toast-error{border-right-color:var(--accent)}
.toast-info{border-right-color:var(--blue)}

.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(230,57,70,.15),transparent 70%),var(--bg);padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.login-card .logo{justify-content:center;margin-bottom:8px;font-size:26px}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:30px}
.login-card .hint{background:var(--bg);padding:12px;border-radius:10px;font-size:12px;
  color:var(--muted);margin-top:16px;text-align:center;line-height:2}
.login-card .hint code{background:var(--card);padding:2px 6px;border-radius:4px;color:var(--gold)}

.admin-layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.admin-sidebar{background:var(--card);border-left:1px solid var(--border);padding:24px 0;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-sidebar .brand{padding:0 24px 24px;font-size:20px;font-weight:900;display:flex;
  align-items:center;gap:10px;border-bottom:1px solid var(--border);margin-bottom:20px}
.admin-sidebar .brand i{color:var(--accent);font-size:26px}
.admin-nav{list-style:none;padding:0 12px}
.admin-nav a{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:10px;
  color:var(--muted);font-size:14px;font-weight:500;margin-bottom:4px;position:relative}
.admin-nav a:hover{background:var(--hover);color:var(--text)}
.admin-nav a.active{background:var(--accent);color:#fff}
.admin-nav a i{font-size:18px;width:22px;text-align:center}
.admin-nav .divider{height:1px;background:var(--border);margin:14px 12px}
.admin-nav .count-pill{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  background:var(--accent);color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:10px}
.admin-main{background:var(--bg);padding:30px;min-height:100vh}
.admin-header{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:30px;gap:16px;flex-wrap:wrap}
.admin-header h1{font-size:24px;font-weight:800}
.admin-header p{color:var(--muted);font-size:13px;margin-top:4px}
.admin-user{display:flex;align-items:center;gap:12px;background:var(--card);
  padding:8px 16px;border-radius:30px;border:1px solid var(--border)}
.admin-user-avatar{width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--gold));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
@media(max-width:900px){.admin-layout{grid-template-columns:1fr}
  .admin-sidebar{position:static;height:auto}}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:30px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;position:relative;overflow:hidden}
.stat-card::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--accent)}
.stat-card.green::before{background:var(--green)}
.stat-card.blue::before{background:var(--blue)}
.stat-card.purple::before{background:var(--purple)}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:22px;margin-bottom:14px;
  background:rgba(230,57,70,.15);color:var(--accent)}
.stat-card.green .stat-icon{background:rgba(16,185,129,.15);color:var(--green)}
.stat-card.blue .stat-icon{background:rgba(59,130,246,.15);color:var(--blue)}
.stat-card.purple .stat-icon{background:rgba(139,92,246,.15);color:var(--purple)}
.stat-value{font-size:26px;font-weight:900;margin-bottom:4px}
.stat-label{font-size:13px;color:var(--muted)}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.stats-grid{grid-template-columns:1fr}}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;margin-bottom:24px}
.panel-head{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;gap:14px;flex-wrap:wrap}
.panel-head h2{font-size:18px;font-weight:800}
.panel-head p{font-size:13px;color:var(--muted);margin-top:4px}

.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead{background:var(--bg)}
th,td{padding:14px 16px;text-align:right;border-bottom:1px solid var(--border)}
th{font-weight:700;font-size:13px;color:var(--muted)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hover)}
.table-product{display:flex;align-items:center;gap:12px}
.table-product-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:22px;background:linear-gradient(135deg,#2a2a35,#1e1e24);
  color:var(--accent);flex-shrink:0;overflow:hidden}
.table-product-icon img{width:100%;height:100%;object-fit:cover}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty i{font-size:60px;color:var(--border);display:block;margin-bottom:16px}
.empty h3{color:var(--text);font-size:18px;margin-bottom:8px}

.page-hero{padding:50px 0 30px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#0d0d0f,#16161a)}
.page-hero h1{font-size:32px;font-weight:800;margin-bottom:8px}
.breadcrumb{display:flex;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.breadcrumb a:hover{color:var(--accent)}

.product-detail{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.product-detail-img{height:420px;background:linear-gradient(135deg,#1e1e24,#2a2a35);
  border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
  font-size:140px;color:var(--accent);border:1px solid var(--border);overflow:hidden}
.product-detail-img img{width:100%;height:100%;object-fit:cover}
.product-detail h1{font-size:28px;font-weight:900;margin-bottom:14px}
.product-detail .price-big{font-size:32px;font-weight:900;color:var(--accent);margin:18px 0}

  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
    return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  try{
    const d = JSON.parse(raw);
    if(!d.users) d.users = DEFAULT_DATA.users;
    if(!d.backups) d.backups = [];
    if(!d.emails) d.emails = [];
    if(!d.cronLog) d.cronLog = [];
    if(!d.cronState) d.cronState = { lastCheck:null, runCount:0, enabled:true };
    if(d.lastAutoBackup === undefined) d.lastAutoBackup = null;
    if(d.settings.autoBackup === undefined) d.settings.autoBackup = true;
    if(!d.settings.emailSender) d.settings.emailSender = 'no-reply@the8shop.ir';
    return d;
  }catch{ return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }

  if(!confirm('همه تغییرات حذف شود؟')) return;

  DB = loadDB(); cart = [];
  sessionStorage.removeItem(SESSION_KEY);
  toast('بازنشانی شد','success');

  editor: { label:'نویسنده', perms:{ products:'write', posts:'write', categories:'write',

  viewer: { label:'ناظر',    perms:{ products:'read', posts:'read', categories:'read',
            orders:'read', users:'none', settings:'none', backups:'none', emails:'none' } }
};
function currentUser(){
  const uid = sessionStorage.getItem(SESSION_KEY);
  if(!uid) return null;
  return DB.users.find(u=>u.id===uid && u.active) || null;
}
function hasPerm(section){
  const u = currentUser(); if(!u) return false;
  const role = ROLES[u.role]; if(!role) return false;
  const p = role.perms[section];
  return p === 'write' || p === 'read';
}
function canWrite(section){
  const u = currentUser(); if(!u) return false;
  const role = ROLES[u.role]; if(!role) return false;
  return role.perms[section] === 'write';
}

   ======================================================================== */
function loadCart(){ try{ return JSON.parse(localStorage.getItem(CART_KEY)) || []; }catch{ return []; } }

function cartCount(){ return cart.reduce((s,i)=>s+i.qty, 0); }
function cartTotal(){
  return cart.reduce((s,i)=>{
    const p = DB.products.find(x=>x.id===i.productId);
    return s + (p ? p.price * i.qty : 0);
  }, 0);
}
function addToCart(productId, qty=1){
  const p = DB.products.find(x=>x.id===productId);
  if(!p){ toast('محصول یافت نشد','error'); return; }
  const item = cart.find(i=>i.productId===productId);
  if(item) item.qty += qty; else cart.push({ productId, qty });
  saveCart(); toast(`«${p.name}» اضافه شد`,'success'); updateCartBadge();
}
function removeFromCart(productId){
  cart = cart.filter(i=>i.productId!==productId);
  saveCart(); updateCartBadge(); if(parseHash()[0]==='cart') render();
}
function updateQty(productId, delta){
  const item = cart.find(i=>i.productId===productId);
  if(!item) return;
  item.qty = Math.max(1, item.qty + delta);

/* ========================================================================

   ======================================================================== */
const $  = (s, ctx=document) => ctx.querySelector(s);
const $$ = (s, ctx=document) => [...ctx.querySelectorAll(s)];
function escapeHTML(str){
  if(str==null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatPrice(num){ return (Number(num)||0).toLocaleString('fa-IR').replace(/,/g,'٫')+' تومان'; }
function toFa(n){ return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
function uid(p='id'){ return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); }
function starsHTML(r){
  let h=''; for(let i=1;i<=5;i++){
    if(r>=i) h+='<i class="bi bi-star-fill"></i>';
    else if(r>=i-0.5) h+='<i class="bi bi-star-half"></i>';
    else h+='<i class="bi bi-star"></i>';
  } return h;
}
function toast(msg, type=''){
  const el = document.createElement('div');
  el.className = 'toast toast-'+type; el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); },2800);
}
function todayJalali(){ return '۱۴۰۳/۰۷/'+toFa(new Date().getDate()); }
function nowTimeFa(){
  const d = new Date();
  return toFa(d.getHours())+':'+toFa(String(d.getMinutes()).padStart(2,'0'))+':'+toFa(String(d.getSeconds()).padStart(2,'0'));
}
function download(filename, content, mime='text/plain'){
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
}

/* ========================================================================
   Modal system
   ======================================================================== */
function showModal(contentHTML, options = {}){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:${options.maxWidth||'560px'}">
      ${options.title?`<div class="modal-head">
        <h3>${escapeHTML(options.title)}</h3>
        <button class="modal-close" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
      </div>`:''}
      <div class="modal-body">${contentHTML}</div>
      ${(options.closeText !== null)?`<div class="modal-foot">
        ${options.actions||''}
        <button class="btn btn-ghost btn-sm" onclick="closeModal()">${escapeHTML(options.closeText||'بستن')}</button>
      </div>`:''}
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
  requestAnimationFrame(()=>overlay.classList.add('show'));
  if(options.onClose) overlay._onClose = options.onClose;
  return overlay;
}
function closeModal(){
  const ov = document.querySelector('.modal-overlay');
  if(!ov) return;
  if(ov._onClose) try{ ov._onClose(); }catch(e){ console.warn(e); }
  ov.classList.remove('show');
  setTimeout(()=>ov.remove(), 250);
}

function createBackup(label='دستی', isAuto=false){
  const snapshot = JSON.stringify(DB);
  const entry = {
    id: uid('bak'),
    label, isAuto,
    date: todayJalali(),
    time: nowTimeFa(),
    size: snapshot.length,
    counts:{
      products: DB.products.length,
      orders: DB.orders.length,
      posts: DB.posts.length,
      users: DB.users.length
    },
    data: snapshot
  };
  DB.backups.unshift(entry);
  if(DB.backups.length > 10) DB.backups = DB.backups.slice(0,10);
  return entry;
}
function saveWithBackup(label){
  const bak = createBackup(label, false);

function restoreBackup(id){
  if(!confirm('بازگردانی این نسخه، همه تغییرات فعلی را حذف می‌کند. مطمئنید؟')) return;
  const bak = DB.backups.find(b=>b.id===id);
  if(!bak){ toast('نسخه یافت نشد','error'); return; }
  try{
    const restored = JSON.parse(bak.data);
    if(!restored.backups) restored.backups = DB.backups;
    if(!restored.emails) restored.emails = DB.emails;
    if(!restored.cronLog) restored.cronLog = DB.cronLog;
    DB = restored;
    saveDB();
    toast('بازگردانی موفق','success');
    render();
  }catch(e){ toast('خطا در بازگردانی','error'); }
}
function deleteBackup(id){
  if(!confirm('این نسخه حذف شود؟')) return;
  DB.backups = DB.backups.filter(b=>b.id!==id);
  saveDB(); toast('حذف شد','success'); render();
}

   PDF Export
   ======================================================================== */
async function exportDashboardPDF(){
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    toast('کتابخانه‌های PDF بارگذاری نشده','error'); return;
  }
  toast('در حال آماده‌سازی گزارش PDF...','info');

  // ساخت HTML گزارش
  const reportHTML = buildReportHTML();
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;top:-99999px;right:0;width:800px;background:#ffffff;color:#000;padding:40px;direction:rtl;font-family:Vazirmatn,Tahoma,sans-serif';
  wrap.innerHTML = reportHTML;
  document.body.appendChild(wrap);

  try{
    const canvas = await html2canvas(wrap, {
      backgroundColor:'#ffffff', scale:2, useCORS:true, logging:false
    });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const ratio = canvas.height / canvas.width;

    const imgW = pageW - 20;
    const imgH = imgW * ratio;

    let yOffset = 0;
    const pageContentH = pageH - 20;

    while(yOffset < imgH){
      if(yOffset > 0) pdf.addPage();
      // crop canvas portion
      const srcY = (yOffset / imgH) * canvas.height;
      const srcH = Math.min((pageContentH / imgH) * canvas.height, canvas.height - srcY);

      const tmpCanvas = document.createElement('canvas');
      tmpCanvas.width = canvas.width;
      tmpCanvas.height = srcH;
      const ctx = tmpCanvas.getContext('2d');
      ctx.drawImage(canvas, 0, srcY, canvas.width, srcH, 0, 0, canvas.width, srcH);
      const partData = tmpCanvas.toDataURL('image/png');

      const partH = (srcH / canvas.height) * imgH;
      pdf.addImage(partData, 'PNG', 10, 10, imgW, partH);

      yOffset += pageContentH;
    }
    const fname = `the8shop-report-${Date.now()}.pdf`;
    pdf.save(fname);
    toast('✅ گزارش PDF دانلود شد','success');
  }catch(e){
    console.error(e);
    toast('خطا در تولید PDF','error');
  }finally{
    wrap.remove();
  }
}

    </p>
    <div style="text-align:center;margin-top:14px">
      <button class="btn btn-ghost btn-sm" onclick="closeBarcodeScanner()">
        <i class="bi bi-x-circle"></i> بستن</button>
    </div>
  `, {
    title:'📷 اسکن بارکد محصول',
    closeText:null,
    maxWidth:'500px',
    onClose: stopBarcodeScanner
  });
  setTimeout(startBarcodeScanner, 250);
}
function startBarcodeScanner(){
  if(!document.getElementById('qrReader')) return;
  try{
    qrScanner = new Html5Qrcode('qrReader', { verbose:false });
    qrScanner.start(
      { facingMode:'environment' },
      { fps:10, qrbox:{ width:250, height:150 } },
      (decodedText) => {
        const code = String(decodedText||'').trim();
        stopBarcodeScanner();
        closeModal();
        // جستجو در محصولات بر اساس بارکد
        const prod = DB.products.find(p=>(p.barcode||'').trim() === code);
        if(prod){
          toast(`✅ محصول یافت شد: ${prod.name}`,'success');
          openBarcodeResultModal(prod, code);
        } else {
          // جستجو در سفارش‌ها
          orderFilters.search = code;
          toast(`🔍 جستجو با کد: ${code}`,'info');
          if(parseHash()[0]==='admin' && parseHash()[1]==='orders'){
            render();
          } else {
            navigate('/admin/orders');
            render();
          }
        }
      },
      () => { /* خطاهای تکی اسکن - نادیده بگیر */ }
    ).catch(err=>{
      console.warn(err);
      toast('دسترسی به دوربین ممکن نیست. از HTTPS استفاده کنید.','error');
      const el = document.getElementById('qrReader');
      if(el) el.innerHTML = '<div style="padding:30px;text-align:center;color:#f87171">'+
        '<i class="bi bi-camera-video-off" style="font-size:40px"></i>'+
        '<p style="margin-top:12px">دوربین در دسترس نیست</p>'+
        '<p style="font-size:12px;color:#9a9aa0">'+
        'مرورگر برای دسترسی به دوربین نیاز به HTTPS یا localhost دارد.'+
        '</p></div>';
    });
  }catch(e){
    console.error(e);
    toast('خطا در راه‌اندازی دوربین','error');
  }
}
function stopBarcodeScanner(){
  if(qrScanner){
    try{
      qrScanner.stop().then(()=>{ qrScanner.clear(); qrScanner = null; })
        .catch(()=>{ qrScanner = null; });
    }catch{ qrScanner = null; }
  }
}

/* ========================================================================

   ======================================================================== */
function isLoggedIn(){ return !!currentUser(); }
function login(u,p){
  const user = DB.users.find(x=>x.username===u && x.password===p && x.active);
  if(user){ sessionStorage.setItem(SESSION_KEY, user.id); return true; }
  return false;
}
function logout(){
  sessionStorage.removeItem(SESSION_KEY);
  location.hash='#/'; render(); toast('خارج شدید','success');
}

/* ========================================================================
   Router
   ======================================================================== */
function parseHash(){
  const h=(location.hash||'#/').slice(1);
  return h.split('/').filter(Boolean);
}
function navigate(path){ location.hash = '#'+path; }

function render(){
  const parts = parseHash();
  const app = $('#app');
  if(parts[0]==='admin'){
    if(!isLoggedIn()) return renderLogin(app);
    return renderAdmin(app, parts[1]||'dashboard', parts[2]);
  }
  if(parts[0]==='shop' && parts[1])    return renderProductDetail(app, parts[1]);
  if(parts[0]==='blog' && parts[1])    return renderPostDetail(app, parts[1]);
  if(parts[0]==='cart')                return renderCart(app);
  if(parts[0]==='checkout')            return renderCheckout(app);
  if(parts[0]==='success' && parts[1]) return renderSuccess(app, parts[1]);
  if(parts[0]==='shop')                return renderPage(app,'shop');
  if(parts[0]==='blog')                return renderPage(app,'blog');
  return renderPage(app,'home');
}
window.addEventListener('hashchange', render);

function processPayment(){
  const name = $('#coName').value.trim();
  const phone = $('#coPhone').value.trim();
  const email = $('#coEmail').value.trim();
  const address = $('#coAddress').value.trim();
  const method = $('input[name="payMethod"]:checked').value;
  if(!name || !phone || !address){ toast('اطلاعات را کامل کنید','error'); return; }
  if(method==='online'){
    const modal = document.createElement('div');
    modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px';
    modal.innerHTML=`<div style="background:#fff;color:#000;border-radius:16px;padding:36px;max-width:420px;width:100%;text-align:center;font-family:Vazirmatn">
      <div style="font-size:14px;color:#666;margin-bottom:8px">درگاه پرداخت بانکی</div>
      <div style="font-size:22px;font-weight:800;color:#111;margin-bottom:24px">${formatPrice(cartTotal()+(cartTotal()>=500000?0:35000))}</div>
      <div style="background:#f0f0f0;padding:16px;border-radius:10px;margin-bottom:20px;font-family:monospace;font-size:13px;text-align:left;direction:ltr">
        <div>Card: 6037-XXXX-XXXX-1234</div>
        <div>Terminal: THE8SHOP</div>
        <div>Ref: ${Date.now().toString().slice(-8)}</div>
      </div>
      <div style="display:flex;gap:10px">
        <button id="payCancel" style="flex:1;padding:12px;border:none;border-radius:10px;background:#eee;color:#333;font-weight:700;cursor:pointer">انصراف</button>
        <button id="payOk" style="flex:1;padding:12px;border:none;border-radius:10px;background:#10b981;color:#fff;font-weight:700;cursor:pointer">پرداخت موفق</button>
      </div></div>`;
    document.body.appendChild(modal);
    $('#payCancel', modal).onclick = ()=>{ modal.remove(); toast('لغو شد','error'); };
    $('#payOk', modal).onclick = ()=>{ modal.remove(); completeOrder(name,phone,email,address,'online'); };
  } else completeOrder(name,phone,email,address,'cod');
}
function completeOrder(name, phone, email, address, method){
  const items = cart.map(i=>{
    const p = DB.products.find(x=>x.id===i.productId);
    return { productId:i.productId, name:p?.name||'', price:p?.price||0, qty:i.qty };
  });
  const subtotal = cartTotal();
  const shipping = subtotal >= 500000 ? 0 : 35000;
  const total = subtotal + shipping;
  const order = {
    id: 'o' + Date.now().toString().slice(-7),
    customer: name, phone, email, address,
    total, status: method==='online'?'completed':'pending',
    date: todayJalali(), method, items
  };
  DB.orders.unshift(order);
  createBackup('سفارش جدید', false);
  saveDB();

  // 📧 ایمیل تأییدیه سفارش
  if(email){
    const tpl = emailOrderTemplate(order, 'confirmed');
    sendSimulatedEmail({
      to: email,
      subject: tpl.subject,
      body: tpl.body,
      orderId: order.id,
      template: 'order-confirmed',
      showPreview: false
    });
    // ایمیل به مدیر
    const adminEmail = DB.users.find(u=>u.role==='admin' && u.email)?.email;
    if(adminEmail && adminEmail !== email){
      sendSimulatedEmail({
        to: adminEmail,
        subject: `🛒 سفارش جدید: ${order.id}`,
        body: `سفارش جدیدی ثبت شد!\n\nشناسه: ${order.id}\nمشتری: ${order.customer}\nمبلغ: ${formatPrice(order.total)}\nروش: ${order.method==='online'?'آنلاین':'در محل'}`,
        orderId: order.id,
        template: 'admin-order',
        showPreview: false
      });
    }
  }

  clearCart();
  navigate('/success/' + order.id);
  render();
}

  if(!o){ navigate('/'); return; }
  const body = `<section class="section"><div class="success-page">

function renderAdmin(app, section, subId){
  const permMap = {
    dashboard:'orders', products:'products', categories:'categories',
    posts:'posts', orders:'orders', emails:'emails',
    users:'users', backups:'backups', settings:'settings'
  };
  const reqPerm = permMap[section] || 'orders';
  if(!hasPerm(reqPerm)){
    app.innerHTML = `<div class="admin-layout">${adminSidebarHTML(section)}
      <main class="admin-main">${adminHeaderHTML('دسترسی غیرمجاز','شما به این بخش دسترسی ندارید')}
        <div class="panel"><div class="empty"><i class="bi bi-shield-x"></i>
          <h3>دسترسی محدود</h3>
          <p>نقش کاربری شما اجازه ورود به این بخش را ندارد.</p>
        </div></div></main></div>`;
    return;
  }

  let content = '';
  if(section==='dashboard')       content = adminDashboard();
  else if(section==='products'){
    if(subId==='new') content = adminProductForm();
    else if(subId)     content = adminProductForm(subId);
    else               content = adminProducts();
  }
  else if(section==='categories') content = adminCategories();
  else if(section==='posts'){
    if(subId==='new') content = adminPostForm();
    else if(subId)     content = adminPostForm(subId);
    else               content = adminPosts();
  }
  else if(section==='orders')     content = adminOrders();
  else if(section==='emails')     content = adminEmails();
  else if(section==='users'){
    if(subId==='new') content = adminUserForm();
    else if(subId)     content = adminUserForm(subId);
    else               content = adminUsers();
  }
  else if(section==='backups')    content = adminBackups();
  else if(section==='settings')   content = adminSettings();
  else                            content = adminDashboard();

  app.innerHTML = `<div class="admin-layout">
    ${adminSidebarHTML(section)}
    <main class="admin-main">${content}</main>
  </div>`;

  if(section==='dashboard') setTimeout(initDashboardCharts, 50);
  if(section==='backups')   setTimeout(updateCronStatusUI, 50);
  updateEmailCount();
}

let salesChartInst=null, catChartInst=null;
function initDashboardCharts(){
  if(typeof Chart==='undefined') return;
  if(salesChartInst) salesChartInst.destroy();
  if(catChartInst) catChartInst.destroy();
  Chart.defaults.font.family='Vazirmatn, Tahoma, sans-serif';
  Chart.defaults.color='#9a9aa0';
  const s = $('#salesChart');
  if(s){
    salesChartInst = new Chart(s.getContext('2d'),{
      type:'bar',
      data:{ labels:DB.salesHistory.map(x=>x.month),
        datasets:[{ label:'فروش', data:DB.salesHistory.map(x=>x.amount),
          backgroundColor:'rgba(230,57,70,.7)', borderColor:'#e63946', borderWidth:2, borderRadius:8 }]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false},
          tooltip:{callbacks:{label:ctx=>formatPrice(ctx.parsed.y)}}},
        scales:{ y:{beginAtZero:true, grid:{color:'rgba(255,255,255,.05)'},
          ticks:{callback:v=>(v/1000000).toFixed(0)+'م'}}, x:{grid:{display:false}}}}
    });
  }
  const c = $('#catChart');
  if(c){
    const catData = DB.categories.map(cat=>{
      return { label:cat.name, count:DB.products.filter(p=>p.categoryId===cat.id).length, color:cat.color };
    });
    catChartInst = new Chart(c.getContext('2d'),{
      type:'doughnut',
      data:{ labels:catData.map(x=>x.label),
        datasets:[{ data:catData.map(x=>x.count), backgroundColor:catData.map(x=>x.color),
          borderColor:'#16161a', borderWidth:3, hoverOffset:10 }]},
      options:{ responsive:true, maintainAspectRatio:false, cutout:'65%',
        plugins:{ legend:{ position:'bottom', labels:{padding:14, boxWidth:12, font:{size:12}}} }}
    });
  }
}
function orderStatusBadge(status){

    cancelled:'<span class="badge badge-red">لغو شده</span>'
  };

}

function startInlineEdit(id){
  const row = $(`#prow-${id}`); const edit = $(`#pedit-${id}`);
  if(row) row.style.display = 'none';
  if(edit) edit.style.display = 'table-row';
}
function cancelInlineEdit(id){
  const row = $(`#prow-${id}`); const edit = $(`#pedit-${id}`);
  if(row) row.style.display = '';
  if(edit) edit.style.display = 'none';
}
function saveInlineEdit(id){
  const p = DB.products.find(x=>x.id===id);
  if(!p){ toast('محصول یافت نشد','error'); return; }
  const name = $(`#ie-name-${id}`).value.trim();
  const price = +$(`#ie-price-${id}`).value;
  const oldPrice = +$(`#ie-old-${id}`).value || 0;
  const stars = +$(`#ie-stars-${id}`).value || 5;
  const barcode = $(`#ie-barcode-${id}`).value.trim();
  const badge = $(`#ie-badge-${id}`).value.trim();
  const categoryId = $(`#ie-cat-${id}`).value;
  if(!name || !price){ toast('نام و قیمت الزامی است','error'); return; }
  p.name = name; p.price = price; p.oldPrice = oldPrice;
  p.stars = stars; p.badge = badge; p.barcode = barcode; p.categoryId = categoryId;
  if(badge && !p.badgeType) p.badgeType = badge.includes('تخفیف') ? 'sale' : '';
  createBackup(`ویرایش سریع: ${name}`, false);
  saveDB(); toast('✅ تغییرات ذخیره شد','success'); render();
}
function deleteProduct(id){
  if(!canWrite('products')){ toast('دسترسی ندارید','error'); return; }

  createBackup('حذف محصول', false);
  DB.products = DB.products.filter(x=>x.id!==id);
  saveDB(); toast('حذف شد','success'); render();
}

function autoBarcode(){
  const code = 'T8S-' + Date.now().toString(36).toUpperCase() + '-' + Math.floor(Math.random()*9000+1000);
  $('#pBarcode').value = code;
  toast('بارکد تولید شد: ' + code,'success');
}
function scanForProductForm(){
  if(typeof Html5Qrcode === 'undefined'){ toast('کتابخانه اسکن بارگذاری نشد','error'); return; }
  showModal(`
    <div class="scanner-frame"><div id="qrReader"></div>
      <div class="scan-overlay"><div class="scan-target"></div></div></div>
    <p style="text-align:center;color:var(--muted);margin-top:14px;font-size:13px">بارکد را در کادر قرار دهید</p>
  `, {
    title:'📷 اسکن بارکد',
    closeText:'انصراف',
    maxWidth:'500px',
    onClose: stopBarcodeScanner
  });
  setTimeout(()=>{
    try{
      qrScanner = new Html5Qrcode('qrReader', { verbose:false });
      qrScanner.start(
        { facingMode:'environment' },
        { fps:10, qrbox:{ width:250, height:150 } },
        (decodedText) => {
          const code = String(decodedText||'').trim();
          stopBarcodeScanner();
          closeModal();
          $('#pBarcode').value = code;
          toast(`بارکد: ${code}`,'success');
        },
        ()=>{}
      ).catch(err=>{
        toast('دسترسی به دوربین ممکن نیست','error');
        const el = document.getElementById('qrReader');
        if(el) el.innerHTML = '<div style="padding:30px;text-align:center;color:#f87171">'+
          '<i class="bi bi-camera-video-off" style="font-size:40px"></i>'+
          '<p style="margin-top:12px">دوربین در دسترس نیست</p></div>';
      });
    }catch(e){ console.error(e); }
  }, 250);

let orderFilters = { search:'', status:'', from:'', to:'', sort:'date-desc' };

function getFilteredOrders(){
  let list = [...DB.orders];
  const f = orderFilters;
  if(f.search){
    const q = f.search.toLowerCase();
    list = list.filter(o =>
      o.customer.toLowerCase().includes(q) ||
      o.phone.includes(q) ||
      o.id.toLowerCase().includes(q) ||
      (o.items||[]).some(it => (it.name||'').toLowerCase().includes(q))
    );
  }
  if(f.status) list = list.filter(o=>o.status === f.status);
  if(f.from)   list = list.filter(o=>o.date >= f.from);
  if(f.to)     list = list.filter(o=>o.date <= f.to);
  list.sort((a,b)=>{
    if(f.sort==='date-desc') return b.date.localeCompare(a.date);
    if(f.sort==='date-asc')  return a.date.localeCompare(b.date);
    if(f.sort==='total-desc')return b.total - a.total;
    if(f.sort==='total-asc') return a.total - b.total;
    return 0;
  });
  return list;
}

function exportOrdersCSV(){
  const filtered = getFilteredOrders();
  if(!filtered.length){ toast('سفارشی برای خروجی وجود ندارد','error'); return; }
  const statusMap = { pending:'در انتظار', shipped:'ارسال شده', completed:'تکمیل شده', cancelled:'لغو شده' };
  const headers = ['شناسه','مشتری','تلفن','ایمیل','آدرس','تعداد اقلام','مبلغ (تومان)','روش پرداخت','وضعیت','تاریخ'];
  const rows = filtered.map(o=>[
    o.id, o.customer, o.phone, o.email||'', o.address||'',
    (o.items?.reduce((s,i)=>s+i.qty,0)||0),
    o.total,
    o.method==='online'?'آنلاین':'در محل',
    statusMap[o.status]||o.status,
    o.date
  ]);
  const csvEscape = v => {
    const s = String(v??'');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const lines = [headers, ...rows].map(r=>r.map(csvEscape).join(','));
  const csv = '\uFEFF' + lines.join('\r\n');
  download(`orders_${Date.now()}.csv`, csv, 'text/csv');
  toast(`${toFa(filtered.length)} سفارش خروجی شد ✅`,'success');
}

          <a href="#/admin/users/${u.id}" class="btn btn-ghost btn-sm"><i class="bi bi-pencil"></i></a>

function adminUserForm(id){
  if(!canWrite('users')){ navigate('/admin/users'); return ''; }
  const isEdit = !!id;
  const u = isEdit ? DB.users.find(x=>x.id===id) : {
    username:'', password:'', fullName:'', email:'', role:'editor', active:true
  };
  if(isEdit && !u){ navigate('/admin/users'); return ''; }
  return `${adminHeaderHTML(isEdit?'ویرایش کاربر':'کاربر جدید', isEdit?u.fullName:'افزودن کاربر')}
  <div class="panel"><form onsubmit="event.preventDefault();saveUser('${id||''}')">
    <div class="form-row">
      <div class="form-group"><label>نام کامل *</label>
        <input class="input" id="uFullName" required value="${escapeHTML(u.fullName)}"></div>
      <div class="form-group"><label>نام کاربری *</label>
        <input class="input" id="uUsername" required value="${escapeHTML(u.username)}"
          ${isEdit?'disabled':''}></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>رمز عبور *</label>
        <input class="input" id="uPassword" required value="${escapeHTML(u.password)}"></div>
      <div class="form-group"><label>ایمیل</label>
        <input class="input" id="uEmail" type="email" value="${escapeHTML(u.email||'')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>نقش کاربری *</label>
        <select class="select" id="uRole">
          <option value="admin"  ${u.role==='admin'?'selected':''}>مدیر کل</option>
          <option value="editor" ${u.role==='editor'?'selected':''}>نویسنده</option>
          <option value="viewer" ${u.role==='viewer'?'selected':''}>ناظر</option>
        </select></div>
      <div class="form-group"><label>وضعیت</label>
        <select class="select" id="uActive">
          <option value="1" ${u.active?'selected':''}>فعال</option>
          <option value="0" ${!u.active?'selected':''}>غیرفعال</option>
        </select></div>
    </div>
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> ذخیره</button>
      <a href="#/admin/users" class="btn btn-outline">انصراف</a>
    </div>
  </form></div>`;
}
function saveUser(id){
  if(!canWrite('users')) return;
  const fullName = $('#uFullName').value.trim();
  const password = $('#uPassword').value;
  const email = $('#uEmail').value.trim();
  const role = $('#uRole').value;
  const active = $('#uActive').value === '1';
  if(!fullName || !password){ toast('نام و رمز الزامی است','error'); return; }
  if(id){
    const u = DB.users.find(x=>x.id===id); if(!u) return;
    u.fullName = fullName; u.password = password; u.email = email;
    u.role = role; u.active = active;
    toast('کاربر ویرایش شد','success');
  } else {
    const username = $('#uUsername').value.trim();
    if(!username){ toast('نام کاربری الزامی است','error'); return; }
    if(DB.users.find(x=>x.username===username)){ toast('این نام کاربری قبلاً استفاده شده','error'); return; }
    DB.users.push({ id: uid('u'), username, password, fullName, email, role, active, createdAt: todayJalali() });
    toast('کاربر جدید اضافه شد','success');
  }
  createBackup('ذخیره کاربر', false);
  saveDB(); navigate('/admin/users'); render();
}
function deleteUser(id){
  if(!canWrite('users')) return;
  if(id === currentUser().id){ toast('نمی‌توانید خودتان را حذف کنید','error'); return; }
  if(!confirm('این کاربر حذف شود؟')) return;
  DB.users = DB.users.filter(x=>x.id!==id);
  createBackup('حذف کاربر', false);
  saveDB(); toast('حذف شد','success'); render();
}

/* ========================================================================
   Admin — Backups (with cron log)
   ======================================================================== */
function adminBackups(){
  const lastRun = DB.cronState.lastCheck;
  return `${adminHeaderHTML('نسخه‌ها و بکاپ','مدیریت نسخه‌های پشتیبان و کرون')}
  <div class="panel">
    <div class="panel-head">
      <div><h2>نسخه‌های پشتیبان</h2>
        <p>حداکثر ۱۰ نسخه اخیر نگه‌داری می‌شوند</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="manualBackup()">
          <i class="bi bi-plus-circle"></i> بکاپ دستی</button>
        <button class="btn btn-success" onclick="downloadBackup()">
          <i class="bi bi-download"></i> دانلود فایل</button>
        <button class="btn btn-ghost" onclick="uploadBackupFile()">
          <i class="bi bi-upload"></i> بازیابی</button>
      </div>
    </div>

    <div style="background:var(--bg);padding:18px;border-radius:10px;border:1px solid var(--border);margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="checkbox" id="autoBakToggle" ${DB.settings.autoBackup?'checked':''}
            onchange="toggleAutoBackup(this.checked)">
          <span style="font-weight:700">⏰ بکاپ خودکار روزانه (کرون پس‌زمینه)</span>
        </label>
        <div class="cron-status" data-cron-status>
          <span class="cron-dot"></span><span>فعال</span>
        </div>
      </div>
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)">
        <div><strong>وضعیت کرون:</strong> هر ۶۰ ثانیه بررسی می‌شود — تعداد اجراها: ${toFa(DB.cronState.runCount||0)}</div>
        <div><strong>آخرین بررسی:</strong> ${lastRun ? toFa(new Date(lastRun).toLocaleString('fa-IR')) : 'هنوز اجرا نشده'}</div>
        <div><strong>آخرین بکاپ خودکار:</strong> ${DB.lastAutoBackup ? toFa(new Date(DB.lastAutoBackup).toLocaleString('fa-IR')) : 'هرگز'}</div>
      </div>
    </div>

    ${DB.backups.length?DB.backups.map(b=>`
      <div class="backup-item">
        <div class="backup-meta">
          <strong>${b.isAuto?'<span class="auto-badge">خودکار</span>':''}${escapeHTML(b.label)}</strong>
          <small>
            <i class="bi bi-calendar3"></i> ${escapeHTML(b.date)} — ${escapeHTML(b.time)} |
            <i class="bi bi-hdd"></i> ${toFa((b.size/1024).toFixed(1))} KB |
            ${toFa(b.counts.products)} محصول، ${toFa(b.counts.orders)} سفارش، ${toFa(b.counts.posts)} مقاله
          </small>
        </div>
        <div class="backup-actions">
          <button class="btn btn-ghost btn-sm" onclick="restoreBackup('${b.id}')">
            <i class="bi bi-arrow-counterclockwise"></i> بازگردانی</button>
          <button class="btn btn-danger btn-sm" onclick="deleteBackup('${b.id}')">
            <i class="bi bi-trash"></i></button>
        </div>
      </div>`).join(''):`<div class="empty">
        <i class="bi bi-clock-history"></i>
        <h3>هیچ نسخه‌ای وجود ندارد</h3>
        <button class="btn btn-primary" style="margin-top:16px" onclick="manualBackup()">
          <i class="bi bi-plus-circle"></i> بکاپ دستی</button>
      </div>`}
  </div>

  <div class="panel">
    <div class="panel-head">
      <div><h2>📋 لاگ کرون پس‌زمینه</h2>
        <p>آخرین فعالیت‌های خودکار سیستم</p></div>
    </div>
    ${(DB.cronLog||[]).length ? DB.cronLog.slice(0,20).map(l=>`
      <div class="cron-log-item">
        <span>${escapeHTML(l.msg)}</span>
        <span class="cl-time">${escapeHTML(l.time)}</span>
      </div>`).join('') : `<div class="empty"><i class="bi bi-list-check"></i>
        <h3>لاگی وجود ندارد</h3></div>`}
  </div>`;
}
function manualBackup(){
  createBackup('بکاپ دستی', false);
  saveDB(); toast('بکاپ ایجاد شد ✅','success'); render();
}
function toggleAutoBackup(enabled){
  DB.settings.autoBackup = enabled;
  saveDB();
  toast(enabled?'کرون فعال شد':'کرون غیرفعال شد','success');
  render();
}
function downloadBackup(){
  const data = { version:'4.0', exportedAt:new Date().toISOString(), db:DB };
  download(`the8shop-backup-${Date.now()}.json`, JSON.stringify(data, null, 2), 'application/json');
  toast('فایل بکاپ دانلود شد ✅','success');
}
function uploadBackupFile(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const parsed = JSON.parse(ev.target.result);
        const newDB = parsed.db || parsed;
        if(!newDB.products || !newDB.users){ toast('فایل نامعتبر است','error'); return; }
        if(!confirm('فایل بکاپ بارگذاری شود؟')) return;
        DB = newDB;
        if(!DB.backups) DB.backups = [];
        if(!DB.emails) DB.emails = [];
        if(!DB.cronLog) DB.cronLog = [];
        saveDB();
        toast('بازگردانی موفق ✅','success');
        render();
      }catch{ toast('خطا در خواندن فایل','error'); }
    };
    reader.readAsText(file);
  };
  input.click();
}
